[project]
name = "pdoom1-analysis"
version = "0.1.0"
description = "Audio analysis for the Zoom Zoom P(doom) music video: stems, beat grid, sections, features, word-level lyric alignment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.*",
    "torchaudio==2.8.*",
    "audio-separator[gpu]>=0.47.0",
    "beat-this>=1.1.0",
    "openai-whisper>=20250625",
    "librosa>=0.11",
    "soundfile>=0.13",
    "soxr>=0.5",
    "scipy>=1.14",
    "numba>=0.61",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "essentia>=2.1b6.dev1110",
    "audioread>=3.0",
]

[tool.uv]
package = false
python-preference = "only-managed"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
